<div class="login-page">
  <form
    class="login-form"
    (ngSubmit)="login()"
  >
    <h1>Login</h1>

    <mat-form-field appearance="outline">
      <mat-label>Username</mat-label>
      <input
        matInput
        name="username"
        [(ngModel)]="username"
        autocomplete="username"
        required
      />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input
        matInput
        type="password"
        name="password"
        [(ngModel)]="password"
        autocomplete="current-password"
        required
      />
    </mat-form-field>

    <button
      mat-raised-button
      color="primary"
      type="submit"
      [disabled]="isLoading()"
    >
      {{ isLoading() ? 'Loading...' : 'Login' }}
    </button>

    <div class="login-debug">status={{ statusMessage() || '-' }}</div>
    <div class="login-debug">
      debug={{ authService.isLoggedIn() ? 'logged-in' : 'logged-out' }}
    </div>
    <div class="login-debug">submits={{ submitCount() }}</div>
  </form>
</div>
