# Put this file on the separate Nginx reverse-proxy server.
# Replace APP_SERVER_PRIVATE_IP and domain with real values.

upstream sp_web_upstream {
  server APP_SERVER_PRIVATE_IP:8080;
  keepalive 32;
}

server {
  listen 80;
  server_name app.example.com;

  location / {
    proxy_pass http://sp_web_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

