# Production docker-compose for super-sync-server
#
# Usage:
#   1. Copy env.example to .env and configure your settings
#   2. Run: docker-compose up -d
#   3. View logs: docker-compose logs -f
#
# For local builds (development):
#   docker-compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

x-logging: &default-logging
  driver: 'json-file'
  options:
    max-size: '10m'
    max-file: '3'

services:
  supersync:
    image: ${SUPERSYNC_IMAGE:-ghcr.io/super-productivity/supersync:latest}
    container_name: supersync-server
    restart: always
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=1900
      - DATABASE_URL=${DATABASE_URL:-file:./data/database.sqlite}
      - JWT_SECRET=${JWT_SECRET}
      - PUBLIC_URL=${PUBLIC_URL:-https://sync.vietinbank.edu.vn}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://app.super-productivity.com}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-sync.vietinbank.edu.vn}
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-Work Planner Sync}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-https://sync.vietinbank.edu.vn}
    ports:
      - '127.0.0.1:8888:1900'
    volumes:
      - supersync-data:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:1900/health',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal
    logging: *default-logging

volumes:
  supersync-data:

networks:
  internal:
    driver: bridge
